stages:
  - name: resolve-pr-base
    type: exec
    in:
      optional:
        prev_branch: "file://session/pr-branch.txt"
    out:
      base_ref_to_open_pr: "file://session/pr-base-ref.txt"
    options:
      cmds:
        - 'printf "%s" "${prev_branch:-{base_ref}}" > "{artifact_dir}/pr-base-ref.txt"'

  - name: compose-pr
    type: agent
    in:
      base_ref_to_open_pr: base_ref_to_open_pr
      optional:
        plan_source_issue_number: "file://session/plan-source-issue-number.txt"
    prompt:
      - gremlins:github_open_pull_request.md
    out:
      pr_title:  "file://session/pr-title.txt"
      pr_body:   "file://session/pr-body.md"
      pr_branch: "file://session/pr-branch.txt"

  - name: push-and-open
    type: exec
    in:
      base_ref_to_open_pr: base_ref_to_open_pr
      pr_branch: pr_branch
      pr_title: pr_title
    out:
      file://session/pr-number.txt: "file://session/pr-number.txt"
      file://session/pr-url.txt:    "file://session/pr-url.txt"
      file://session/pr-branch.txt: "file://session/pr-branch.txt"
      gh://pr: "gh://pr/{read:file://session/pr-number.txt}"
    options:
      cmds:
        - |
          SUFFIX=$([ "{loop_iteration}" -gt 1 ] && echo "-iter{loop_iteration}" || echo "") &&
          BRANCH="$(printf '%s' "${pr_branch}")${SUFFIX}" &&
          git push origin "HEAD:refs/heads/$BRANCH" &&
          URL="$(gh pr create --head "$BRANCH" --base "$base_ref_to_open_pr" --title "$(printf '%s' "$pr_title")" --body-file "{artifact:pr_body}")" &&
          printf "%s" "${URL##*/}" > "{artifact_dir}/pr-number.txt" &&
          printf "%s" "$URL" > "{artifact_dir}/pr-url.txt" &&
          printf "%s" "$BRANCH" > "{artifact_dir}/pr-branch.txt"
