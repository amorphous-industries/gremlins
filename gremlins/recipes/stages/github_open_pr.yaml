stages:
  - name: resolve-pr-base
    type: exec
    in:
      prev_branch: pr-branch?
    out:
      base_ref_to_open_pr: "file://session/pr-base-ref.txt"
    options:
      cmds:
        - 'printf "%s" "${prev_branch:-{base_ref}}" > "{artifact_dir}/pr-base-ref.txt"'

  - name: compose-pr
    type: agent
    in:
      base_ref_to_open_pr: base_ref_to_open_pr
      plan_source_issue_number: plan-source-issue-number?
    prompt:
      - gremlins:github_open_pull_request.md
    out:
      pr_title:  "file://session/pr-title.txt"
      pr_body:   "file://session/pr-body.md"
      pr_branch: "file://session/pr-branch.txt"

  - name: push-and-open
    type: exec
    in:
      base_ref_to_open_pr: base_ref_to_open_pr
      pr_branch: pr_branch
      pr_title: pr_title
      pr_body: pr_body
    out:
      pr-number: "file://session/pr-number.txt"
      pr-url:    "file://session/pr-url.txt"
      pr-branch: "file://session/pr-branch.txt"
      pr: "gh://pr/{read:pr-number}"
    options:
      cmds:
        - |
          SUFFIX=$([ "{loop_iteration}" -gt 1 ] && echo "-iter{loop_iteration}" || echo "") &&
          BRANCH="${pr_branch}${SUFFIX}" &&
          git push origin "HEAD:refs/heads/$BRANCH" &&
          URL="$(gh pr create --head "$BRANCH" --base "$base_ref_to_open_pr" --title "$pr_title" --body-file "{artifact:pr_body}")" &&
          printf "%s" "${URL##*/}" > "{artifact_dir}/pr-number.txt" &&
          printf "%s" "$URL" > "{artifact_dir}/pr-url.txt" &&
          printf "%s" "$BRANCH" > "{artifact_dir}/pr-branch.txt"
