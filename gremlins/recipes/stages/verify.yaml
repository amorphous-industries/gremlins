required-options:
  - cmds
required-prompt: true

stages:
  - name: verify
    type: loop
    stop_when_exists: done
    max-iterations: "{{options.max_iterations | default(3)}}"
    body:
      - name: cmd
        type: exec
        bind:
          artifact.verify_log: "file://session/exec-{name}.log"
          artifact.done?: "file://session/done"
        options:
          cmds:
            - ({{options.cmds}}); rc=$?; printf '%d' "$rc" > "{artifact_dir}/exec_exit_code"; if [ "$rc" -eq 0 ]; then printf 'done' > "{artifact_dir}/done"; fi; true
      - name: fix
        type: agent
        skip_if_exists: done
        prompt:
          - "{{prompt}}"
        interpolation:
          verify_output: artifact.verify_log
