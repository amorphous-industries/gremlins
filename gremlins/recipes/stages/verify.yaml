required-options:
  - cmds
required-prompt: true

stages:
  - name: verify
    type: loop
    stop_when_exists: done
    max-iterations: "{{options.max_iterations | default(3)}}"
    body:
      - name: cmd
        type: exec
        out:
          verify_log: "file://session/exec-{name}.log"
          done?: "file://session/done"
        options:
          cmds:
            - ({{options.cmds}}) && printf 'done' > "{artifact_dir}/done"; true
      - name: fix
        type: agent
        skip_if_exists: done
        prompt:
          - "{{prompt}}"
        in:
          verify_output: verify_log
        out:
          done: "file://session/done"
