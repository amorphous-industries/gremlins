required-prompt: true

stages:
  - name: plan
    type: agent
    skip_if_exists: plan
    prompt:
      - "{{prompt}}"
    in:
      optional:
        instructions: "file://session/instructions.txt"
    out:
      plan: "file://session/plan.md"
    options:
      idle_timeout: 600

  - name: set-description
    type: exec
    out:
      optional:
        description: "file://session/description.txt"
    options:
      cmds:
        - "head -1 \"{artifact:plan}\" | sed 's/^#\\+ *//' > \"{artifact_dir}/description.txt\""