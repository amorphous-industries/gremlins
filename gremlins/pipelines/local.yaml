default_client: 'xai:grok-4'

base_ref: current

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: [filepath, string]
      optional: true
  launch_cmds:
    - |
      if [ -n "${plan+x}" ]; then
        if echo "$plan" | grep -qE '^([^/]+/[^#]+)?#[0-9]+$'; then
          gh issue view "$plan" --json body --jq .body > "{artifact_dir}/plan.md" 2>/dev/null
          if ! head -1 "{artifact_dir}/plan.md" | grep -q '^# ' 2>/dev/null; then
            title=$(gh issue view "$plan" --json title --jq .title 2>/dev/null)
            printf '# %s\n\n' "$title" | cat - "{artifact_dir}/plan.md" > "{artifact_dir}/plan.md.tmp"
            mv "{artifact_dir}/plan.md.tmp" "{artifact_dir}/plan.md"
          fi
          gh issue view "$plan" --json number --jq .number > "{artifact_dir}/plan-source-issue-number.txt" 2>/dev/null
        elif [ -f "$plan" ]; then
          cp "$plan" "{artifact_dir}/plan.md"
        else
          printf '%s' "$plan" > "{artifact_dir}/plan.md"
        fi
      fi
    - |
      if [ -n "${instructions+x}" ]; then
        if [ -f "$instructions" ]; then
          cp "$instructions" "{artifact_dir}/instructions.txt"
        else
          printf '%s' "$instructions" > "{artifact_dir}/instructions.txt"
        fi
      fi
  cli_out:
    plan?: file://session/plan.md
    plan-source-issue-number?: file://session/plan-source-issue-number.txt
    instructions?: file://session/instructions.txt

prompts:
  code-style: gremlins:code_style.md
  verify: [gremlins:verify_fix.md, gremlins:bail_section_fix.md]

stages:
  - { type: gremlins:plan,       prompt: [code-style, gremlins:plan.md] }
  - { type: gremlins:implement,  prompt: [code-style, gremlins:implement_local.md] }
  - { type: review-code,  prompt: [code-style, gremlins:review/detail.md] }
  - { name: address-code, type: agent, prompt: [code-style, gremlins:address.md, gremlins:bail_section.md], in: {text: review-code} }
  - name: normalize
    type: exec
    options:
      cmds:
        - "ruff format . && ruff check --fix . && git add -A && (git diff --cached --quiet || git commit -m 'normalize')"
    out:
      normalize-commits: git://range
  - { name: verify-check, type: verify, options: { cmds: ["make check"] }, prompt: verify }
  - { name: verify-test,  type: verify, options: { cmds: ["make test"] },  prompt: verify }
