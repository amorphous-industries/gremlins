# Extends an existing PR: plan, implement, verify, push, then review/CI.
# Usage: gremlins launch pr-extend --pr <num|url> --plan '#<issue>'

default_client: 'xai:grok-4'

base_ref: main

github_integration: true

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: [filepath, string]
      optional: true
    pr:
      type: string
  launch_cmds:
    - gremlins:bind_artifact(plan, plan, file://session/plan.md)
    - gremlins:bind_artifact(instructions, instructions, file://session/instructions.txt)
    - |
      if [ -n "${pr+x}" ]; then
        printf '%s' "${pr##*/}" > "{artifact_dir}/pr-num.txt"
      fi
  cli_out:
    pr-num?: file://session/pr-num.txt
    pr: "gh://pr/{read:pr-num}"

prompts:
  code-style: gremlins:code_style.md
  verify: [gremlins:verify_fix.md, gremlins:bail_section_fix.md]

stages:
  - name: fetch-pr-info
    type: exec
    interpolation:
      pr_uri: artifact.pr.uri
    bind:
      artifact.pr-url:    "file://session/pr-url.txt"
      artifact.pr-branch: "file://session/pr-branch.txt"
      artifact.pr-number: "file://session/pr-number.txt"
    options:
      cmds:
        - |
          PR_NUM="${pr_uri##*/}" &&  # gh://pr/N — strip trailing segment to get number
          PR_JSON="$(gh pr view "$PR_NUM" --json url,headRefName,number)" &&
          printf "%s" "$(printf '%s' "$PR_JSON" | jq -r '.url')" > "{artifact_dir}/pr-url.txt" &&
          printf "%s" "$(printf '%s' "$PR_JSON" | jq -r '.headRefName')" > "{artifact_dir}/pr-branch.txt" &&
          printf "%s" "$(printf '%s' "$PR_JSON" | jq -r '.number')" > "{artifact_dir}/pr-number.txt"
  - { type: gremlins:plan-gh,                    prompt: [code-style, gremlins:plan_gh.md] }
  - { type: gremlins:implement,                 prompt: [code-style, gremlins:implement_gh.md] }
  - name: normalize
    type: exec
    options:
      cmds:
        - "ruff format . && ruff check --fix . && git add -A && (git diff --cached --quiet || git commit -m 'normalize')"
    bind:
      artifact.normalize-commits: git://range
  - { name: verify-check, type: verify, options: { cmds: ["make check"] }, prompt: verify }
  - { name: verify-test,  type: verify, options: { cmds: ["make test"] },  prompt: verify }
  - { name: push,      type: gremlins:github-push-to-pr-branch }
  - { type: gremlins:github-request-copilot-review }
  - name: fetch-pr-diff
    type: exec
    interpolation: {pr: artifact.pr-url}
    bind:
      artifact.pr-diff: "file://session/diff.txt"
    options:
      cmds:
        - |
          gh pr diff "{pr}" > "{artifact_dir}/diff.txt" &&
          SIZE=$(wc -c < "{artifact_dir}/diff.txt") &&
          if [ "$SIZE" -gt 100000 ]; then
            printf 'PR diff too large to inline (%d bytes). Reviewer should fetch the diff directly via gh pr diff.' "$SIZE" > "{artifact_dir}/diff.txt"
          fi
  - { name: github-review-pull-request,                             type: agent, interpolation: {pr: artifact.pr-url, plan: artifact.plan, diff: artifact.pr-diff}, prompt: [code-style, gremlins:github_review_pull_request.md] }
  - { type: gremlins:github-wait-copilot }
  - { name: github-address-pull-request-reviews,                    type: agent, interpolation: {pr: artifact.pr-url}, prompt: [code-style, gremlins:github_address_pull_request_reviews.md, gremlins:bail_section.md] }
  - { name: ci-gate,   type: gremlins:github-wait-ci,               prompt: [gremlins:ci_fix.md, gremlins:bail_section_fix.md] }
