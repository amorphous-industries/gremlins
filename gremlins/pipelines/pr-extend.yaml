# Extends an existing PR: plan, implement, verify, push, then review/CI.
# Usage: gremlins launch pr-extend --pr <num|url> --plan '#<issue>'

default_client: 'xai:grok-4'

base_ref: main

github_integration: true

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: [filepath, string]
      optional: true
    pr:
      type: string
  launch_cmds:
    - |
      if [ -n "${plan+x}" ]; then
        gh_issue=""
        if echo "$plan" | grep -qE '^[^/]+/[^#]+#[0-9]+$'; then
          gh_repo="${plan%#*}"
          gh_issue="${plan##*#}"
          _gh_vi() { gh issue view --repo "$gh_repo" "$@"; }
        elif echo "$plan" | grep -qE '^#[0-9]+$'; then
          gh_issue="${plan#\#}"
          _gh_vi() { gh issue view "$@"; }
        fi
        if [ -n "$gh_issue" ]; then
          _gh_vi "$gh_issue" --json body --jq .body > "{artifact_dir}/plan.md"
          if ! head -1 "{artifact_dir}/plan.md" | grep -q '^# '; then
            title=$(_gh_vi "$gh_issue" --json title --jq .title)
            printf '# %s\n\n' "$title" | cat - "{artifact_dir}/plan.md" > "{artifact_dir}/plan.md.tmp"
            mv "{artifact_dir}/plan.md.tmp" "{artifact_dir}/plan.md"
          fi
          _gh_vi "$gh_issue" --json number --jq .number | tr -d '\n' > "{artifact_dir}/plan-source-issue-number.txt"
        elif [ -f "$plan" ]; then
          cp "$plan" "{artifact_dir}/plan.md"
        else
          printf '%s' "$plan" > "{artifact_dir}/plan.md"
        fi
      fi
    - |
      if [ -n "${instructions+x}" ]; then
        if [ -f "$instructions" ]; then
          cp "$instructions" "{artifact_dir}/instructions.txt"
        else
          printf '%s' "$instructions" > "{artifact_dir}/instructions.txt"
        fi
      fi
    - |
      if [ -n "${pr+x}" ]; then
        printf '%s' "${pr##*/}" > "{artifact_dir}/pr-num.txt"
      fi
  cli_out:
    plan?: file://session/plan.md
    plan-source-issue-number?: file://session/plan-source-issue-number.txt
    instructions?: file://session/instructions.txt
    pr-num?: file://session/pr-num.txt
    pr: "gh://pr/{read:pr-num}"

prompts:
  code-style: gremlins:code_style.md
  verify: [gremlins:verify_fix.md, gremlins:bail_section_fix.md]

stages:
  - name: fetch-pr-info
    type: exec
    in:
      pr_uri: pr.uri
    out:
      pr-url:    "file://session/pr-url.txt"
      pr-branch: "file://session/pr-branch.txt"
      pr-number: "file://session/pr-number.txt"
    options:
      cmds:
        - |
          PR_NUM="${pr_uri##*/}" &&  # gh://pr/N — strip trailing segment to get number
          PR_JSON="$(gh pr view "$PR_NUM" --json url,headRefName,number)" &&
          printf "%s" "$(printf '%s' "$PR_JSON" | jq -r '.url')" > "{artifact_dir}/pr-url.txt" &&
          printf "%s" "$(printf '%s' "$PR_JSON" | jq -r '.headRefName')" > "{artifact_dir}/pr-branch.txt" &&
          printf "%s" "$(printf '%s' "$PR_JSON" | jq -r '.number')" > "{artifact_dir}/pr-number.txt"
  - { type: gremlins:plan-gh,                    prompt: [code-style, gremlins:plan_gh.md] }
  - { type: gremlins:implement,                 prompt: [code-style, gremlins:implement_gh.md] }
  - name: normalize
    type: exec
    options:
      cmds:
        - "ruff format . && ruff check --fix . && git add -A && (git diff --cached --quiet || git commit -m 'normalize')"
    out:
      normalize-commits: git://range
  - { name: verify-check, type: verify, options: { cmds: ["make check"] }, prompt: verify }
  - { name: verify-test,  type: verify, options: { cmds: ["make test"] },  prompt: verify }
  - { name: push,      type: gremlins:github-push-to-pr-branch }
  - { type: gremlins:github-request-copilot-review }
  - { name: github-review-pull-request,                             type: agent, in: {pr: pr-url}, prompt: [code-style, gremlins:github_review_pull_request.md] }
  - { type: gremlins:github-wait-copilot }
  - { name: github-address-pull-request-reviews,                    type: agent, in: {pr: pr-url}, prompt: [code-style, gremlins:github_address_pull_request_reviews.md, gremlins:bail_section.md] }
  - { name: ci-gate,   type: gremlins:github-wait-ci,               prompt: [gremlins:ci_fix.md, gremlins:bail_section_fix.md] }
