base_ref: current
prompt_dir: prompts

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: filepath
      optional: true
  launch_cmds:
    - gremlins:bind_artifact(plan, plan, file://session/plan.md)
    - gremlins:bind_artifact(instructions, instructions, file://session/instructions.txt)
  cmds:
    - uv venv .venv
    - uv pip install -e ".[dev]"

prompts:
  code-style: gremlins:code_style.md
  terse: terse_style.md
  verify: [dev-env-howto.md, gremlins:verify_fix.md, gremlins:bail_section_fix.md]
  dev-env: dev-env-howto.md

stage-definitions:
  normalize:
    type: exec
    options:
      cmds:
        - "ruff format ."
        - "ruff check --fix ."
        - "git add -A"
        - "git diff --cached --quiet || git commit -m 'normalize'"

stages:
  - { type: gremlins:plan,      prompt: [code-style, terse, gremlins:plan.md] }
  - { type: gremlins:implement,  prompt: [code-style, terse, dev-env, no_lint_in_implement.md, gremlins:implement_local.md] }
  - { type: normalize }
  - name: verify-check
    type: verify
    options:
      cmds: ["make check"]
      max_iterations: 7
    prompt: verify

  - { type: gremlins:review-code,  prompt: [code-style, terse, dev-env, local_review.md] }
  - { name: address-code, type: agent, in: {text: "file://session/review-code.md"}, prompt: [code-style, terse, dev-env, gremlins:address.md, gremlins:bail_section.md] }

  - { type: normalize }
  - name: verify-check-final
    type: verify
    options:
      cmds: ["make check"]
      max_iterations: 7
    prompt: verify
  - name: verify-test
    type: verify
    options:
      cmds: ["PYTEST_ADDOPTS='-q --tb=short --no-header' make test"]
      max_iterations: 7
    prompt: verify
