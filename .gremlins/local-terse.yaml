base_ref: current
prompt_dir: prompts

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: filepath
      optional: true
  launch_cmds:
    - gremlins:bind_artifact(plan, plan, file://session/plan.md)
    - gremlins:bind_artifact(instructions, instructions, file://session/instructions.txt)
  cmds:
    - uv venv .venv
    - uv pip install -e ".[dev]"

prompts:
  code-style: gremlins:code_style.md
  terse: terse_style.md
  verify: [dev-env-howto.md, gremlins:verify_fix.md, gremlins:bail_section_fix.md]
  dev-env: dev-env-howto.md

stage-definitions:
  check-and-fix:
    type: sequence
    body:
      - name: format
        type: exec
        options:
          cmds:
            - make autoformat
            - git add -A
            - git diff --cached --quiet || git commit -m 'format'

      - name: verify
        type: verify
        options:
          cmds:
            - "make -j8 check && make -j8 test"
          max_iterations: 7
        prompt: [dev-env-howto.md, gremlins:verify_fix.md, gremlins:bail_section_fix.md]

stages:
  - { type: gremlins:plan,      prompt: [code-style, terse, gremlins:plan.md] }
  - { type: gremlins:implement,  prompt: [code-style, terse, dev-env, no_lint_in_implement.md, gremlins:implement_local.md] }
  - { name: check-and-fix, type: check-and-fix }
  - { type: gremlins:review-code,  prompt: [code-style, terse, dev-env, local_review.md] }
  - { name: address-code, type: agent, interpolation: {text: artifact.review-code}, prompt: [code-style, terse, dev-env, gremlins:address.md, gremlins:bail_section.md] }
  - { name: check-and-fix-2, type: check-and-fix }
