default_client: openrouter:deepseek-v4-pro
base_ref: current
prompt_dir: prompts

inputs:
  in:
    INSTRUCTIONS: instructions?
    PLAN: plan?
  sources:
    plan:
      type: filepath
      optional: true

prompts:
  code-style: gremlins:code_style.md
  terse: terse_style.md
  verify: [dev-env-howto.md, verify_fix.md, gremlins:bail_section_fix.md]
  dev-env: dev-env-howto.md

stage-definitions:
  normalize:
    type: exec
    options:
      cmds:
        - "ruff format ."
        - "ruff check --fix ."
        - "git add -A"
        - "git diff --cached --quiet || git commit -m 'normalize'"

bootstrap:
  - uv venv .venv
  - uv pip install -e ".[dev]"

stages:
  - { type: gremlins:plan,      prompt: [code-style, terse, gremlins:plan.md] }
  - { type: gremlins:implement,  prompt: [code-style, terse, dev-env, no_lint_in_implement.md, gremlins:implement_local.md] }
  - { type: normalize }
  - { name: verify-check, type: verify, options: { cmds: ["make check"] }, prompt: verify }

  - { type: gremlins:review-code,  prompt: [code-style, terse, dev-env, gremlins:review/detail.md] }
  - { name: address-code, type: agent, in: {text: review-code}, prompt: [code-style, terse, dev-env, gremlins:address.md, gremlins:bail_section.md] }

  - { type: normalize }
  - { name: verify-check-2, type: verify, options: { cmds: ["make check"] }, prompt: verify }
  - { name: verify-test, type: verify, options: { cmds: ["make test"] }, prompt: verify }
