base_ref: current
prompt_dir: prompts

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: filepath
      optional: true
  launch_cmds:
    - gremlins:bind_artifact(plan, plan, file://session/plan.md)
    - gremlins:bind_artifact(instructions, instructions, file://session/instructions.txt)
  cmds:
    - uv venv .venv
    - uv pip install -e ".[dev]"
  env: |
    export GREMLINS_OPENAI_AGENTS_MAX_TURNS='1000'
    unset VIRTUAL_ENV UV_PYTHON UV_PROJECT_ENVIRONMENT UV_SYSTEM_PYTHON PYTHONPATH
    export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-${GREMLINS_PROJECT_ROOT}/.cargo-gremlin-target}"
    if command -v sccache &>/dev/null; then
        export RUSTC_WRAPPER="${RUSTC_WRAPPER:-sccache}"
    fi
    SECRET_ENV="${GREMLINS_PROJECT_ROOT}/.gremlins/secret_env"
    if [ -f "$SECRET_ENV" ]; then
        source "$SECRET_ENV"
    fi

prompts:
  code-style: gremlins:code_style.md
  terse: terse_style.md
  verify: [dev-env-howto.md, gremlins:verify_fix.md, gremlins:bail_section_fix.md]
  dev-env: dev-env-howto.md

stage-definitions:
  check-and-fix:
    type: sequence
    body:
      - name: format
        type: exec
        options:
          cmds:
            - make autoformat || true
            - git add -A
            - git diff --cached --quiet || git commit -m 'format'

      - name: verify
        type: verify
        options:
          cmds:
            - "make -j8 check && make -j8 test"
          max_iterations: 7
        prompt: [dev-env-howto.md, gremlins:verify_fix.md, gremlins:bail_section_fix.md]
      - name: commit
        type: exec
        options:
          cmds:
            - git add -A
            - git diff --cached --quiet || git commit -m "fix checks"

stages:
  - { type: gremlins:plan,      prompt: [code-style, terse, gremlins:plan.md] }
  - { type: gremlins:implement,  prompt: [code-style, terse, dev-env, no_lint_in_implement.md, gremlins:implement_local.md] }
  - { type: check-and-fix }
  - { type: gremlins:review-code,  prompt: [code-style, terse, dev-env, local_review.md] }
  - { name: address-code, type: agent, interpolation: {text: artifact.review-code}, prompt: [code-style, terse, dev-env, gremlins:address.md, gremlins:bail_section.md] }
  - { , type: check-and-fix }
