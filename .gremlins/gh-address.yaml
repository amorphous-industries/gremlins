base_ref: main
prompt_dir: prompts

land:
  interpolation:
    PR_URL: content("artifact://pr-url")
  options:
    cmds:
      - gh pr merge --squash --delete-branch "$PR_URL"

prompts:
  code-style: gremlins:code_style.md
  terse: terse_style.md
  dev-env: dev-env-howto.md

stage-definitions:
  github-wait-ci: github-wait-ci

# Usage:
#   gremlins resume --graft gh-address <gremlin_id>
#
# Re-runs the address-reviews / format / wait-CI tail of gh-terse.yaml.
# Use when reviewer comments on an existing PR need another pass.

bootstrap:
  cmds:
    - uv venv .venv
    - uv pip install -e ".[dev]"
  env: |
    export GREMLINS_OPENAI_AGENTS_MAX_TURNS='1000'
    unset VIRTUAL_ENV UV_PYTHON UV_PROJECT_ENVIRONMENT UV_SYSTEM_PYTHON PYTHONPATH
    export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-${GREMLINS_PROJECT_ROOT}/.cargo-gremlin-target}"
    if command -v sccache &>/dev/null; then
        export RUSTC_WRAPPER="${RUSTC_WRAPPER:-sccache}"
    fi
    THE_ENV="${GREMLINS_PROJECT_ROOT}/.gremlins/env"
    if [ -f "$THE_ENV" ]; then
        source "$THE_ENV"
    fi
    export VIRTUAL_ENV="${GREMLINS_WORKTREE_PATH}/.venv"
    export UV_PROJECT_ENVIRONMENT="${GREMLINS_WORKTREE_PATH}/.venv"
    export PATH="${GREMLINS_WORKTREE_PATH}/.venv/bin:${PATH}"

stages:
  - name: gather-github-review-content
    type: exec
    interpolation:
      pr: content("artifact://pr-url")
    bind:
      github_review_content: "artifact://github-review-content.md"
    options:
      cmds:
        - |
          set -e
          set -o pipefail
          PR_URL="{pr}"
          PR_JSON="$(gh pr view "$PR_URL" --json number,title,body,author,baseRefName,headRefName)"
          PR_NUMBER="$(echo "$PR_JSON" | jq -r '.number')"
          OWNER_REPO="$(echo "$PR_URL" | sed 's|https://github.com/||; s|/pull/.*||')"
          PR_TITLE="$(echo "$PR_JSON" | jq -r '.title')"
          PR_BODY="$(echo "$PR_JSON" | jq -r '.body')"
          PR_AUTHOR="$(echo "$PR_JSON" | jq -r '.author.login')"
          PR_HEAD_REF="$(echo "$PR_JSON" | jq -r '.headRefName')"
          PR_BASE_REF="$(echo "$PR_JSON" | jq -r '.baseRefName')"
          {
            echo "# PR Review Comments"
            echo
            echo "**PR:** $PR_URL"
            echo "**Number:** #$PR_NUMBER"
            echo "**Title:** $PR_TITLE"
            echo "**Author:** $PR_AUTHOR"
            echo "**Branch:** $PR_HEAD_REF → $PR_BASE_REF"
            echo "**Owner/Repo:** $OWNER_REPO"
            echo
            if [ -n "$PR_BODY" ] && [ "$PR_BODY" != "null" ]; then
              echo "## PR Description"
              echo
              echo "$PR_BODY"
              echo
            fi
            echo "## Review Comments"
            echo
            gh api "repos/$OWNER_REPO/pulls/$PR_NUMBER/comments" --paginate --jq '.[] | "### Comment \(.id) by \(.user.login)\n\n\(.body)\n\n_File: `\(.path):\(.line // .original_line)`_\n\n---\n"'
            echo
            echo "## Issue Comments"
            echo
            gh pr view "$PR_URL" --comments --json comments --jq '.comments[] | "### Comment by \(.author.login) (\(.createdAt))\n\n\(.body)\n\n---\n"'
          } > "$GREMLINS_ARTIFACT_DIR/github-review-content.md"
  - name: github-address-pull-request-reviews
    type: agent
    interpolation:
      pr: content("artifact://pr-url")
      content: content("artifact://github-review-content.md")
    prompt:
      - code-style
      - terse
      - dev-env
      - github_address_pull_request_reviews.md
      - gremlins:bail_section.md
  - type: exec
    options:
      cmds:
        - "ruff format ."
        - "git add -A"
        - "git diff --cached --quiet || git commit -m 'normalize'"
  - { type: github-wait-ci, prompt: [terse, dev-env, gremlins:ci_fix.md, gremlins:bail_section_fix.md] }