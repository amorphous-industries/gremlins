base_ref: main
prompt_dir: prompts

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: [filepath, string]
      optional: true
  launch_cmds:
    - gremlins:bind_artifact(plan, plan, file://session/plan.md)
    - gremlins:bind_artifact(instructions, instructions, file://session/instructions.txt)
  cmds:
    - uv venv .venv
    - uv pip install -e ".[dev]"

land:
  in:
    PR_URL: pr-url
  options:
    cmds:
      - gh pr merge --squash --delete-branch "$PR_URL"
      - git fetch origin
      - git branch -f main origin/main 2>/dev/null || git merge --ff-only origin/main

prompts:
  code-style: gremlins:code_style.md
  terse: terse_style.md
  dev-env: dev-env-howto.md

stage-definitions:
  normalize:
    type: exec
    options:
      cmds:
        - "ruff format ."
        - "ruff check --fix --exit-zero ."
        - "git add -A"
        - "git diff --cached --quiet || git commit -m 'normalize'"
        - "git push 2>/dev/null || true"

stages:
  - { type: gremlins:plan-gh, prompt: [code-style, terse, gremlins:plan_gh.md] }
  - { type: gremlins:implement, prompt: [code-style, terse, dev-env, no_lint_in_implement.md, gremlins:implement_gh.md] }
  - { type: normalize }
  - type: verify
    options:
      cmds: ["make check"]
      max_iterations: 7
    prompt: [dev-env-howto.md, gremlins:verify_fix.md, gremlins:bail_section_fix.md]
  - type: verify
    options:
      cmds: ["PYTEST_ADDOPTS='-q --tb=short --no-header' make test"]
      max_iterations: 7
    prompt: [dev-env-howto.md, gremlins:verify_fix.md, gremlins:bail_section_fix.md]

  - parallel:
      - name: local-review-one
        type: agent
        prompt: [code-style, terse, dev-env, local_review.md]
        out:
          local-review-one: "file://session/local-review-one.md"
      - name: local-review-two
        type: agent
        prompt: [code-style, terse, dev-env, local_review.md]
        out:
          local-review-two: "file://session/local-review-two.md"

  - name: local-address
    type: agent
    prompt: [code-style, terse, dev-env, local_address.md, no_lint_in_implement.md, gremlins:bail_section.md]
    in:
      review-one: local-review-one
      review-two: local-review-two

  - { type: normalize }
  - type: verify
    options:
      cmds: ["make check"]
      max_iterations: 7
    prompt: [dev-env-howto.md, gremlins:verify_fix.md, gremlins:bail_section_fix.md]
  - type: verify
    options:
      cmds: ["PYTEST_ADDOPTS='-q --tb=short --no-header' make test"]
      max_iterations: 7
    prompt: [dev-env-howto.md, gremlins:verify_fix.md, gremlins:bail_section_fix.md]
  - { type: gremlins:github-open-pr }
  - { type: gremlins:github-request-copilot-review }
  - { type: gremlins:github-wait-copilot, in: {pr: pr} }
  - { name: github-address-pull-request-reviews, type: agent, in: {pr: pr}, prompt: [code-style, terse, dev-env, gremlins:github_address_pull_request_reviews.md, gremlins:bail_section.md] }
  - { type: normalize }
  - type: verify
    options:
      cmds: ["make check"]
      max_iterations: 7
    prompt: [dev-env-howto.md, gremlins:verify_fix.md, gremlins:bail_section_fix.md]
  - type: verify
    options:
      cmds: ["PYTEST_ADDOPTS='-q --tb=short --no-header' make test"]
      max_iterations: 7
    prompt: [dev-env-howto.md, gremlins:verify_fix.md, gremlins:bail_section_fix.md]
  - { type: gremlins:github-wait-ci, in: {pr: pr}, prompt: [terse, dev-env, gremlins:ci_fix.md, gremlins:bail_section_fix.md] }
