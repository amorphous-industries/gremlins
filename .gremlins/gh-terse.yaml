base_ref: main
prompt_dir: prompts

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: [filepath, string]
      optional: true
  launch_cmds:
    - gremlins:bind_artifact(plan, plan, file://session/plan.md)
    - gremlins:bind_artifact(instructions, instructions, file://session/instructions.txt)
  cmds:
    - uv venv .venv
    - uv pip install -e ".[dev]"

land:
  interpolation:
    PR_URL: artifact.pr-url
  options:
    cmds:
      - gh pr merge --squash --delete-branch "$PR_URL"
      - git fetch origin
      - git branch -f main origin/main 2>/dev/null || git merge --ff-only origin/main

prompts:
  code-style: gremlins:code_style.md
  terse: terse_style.md
  dev-env: dev-env-howto.md

stage-definitions:
  check-and-fix:
    type: sequence
    body:
      - name: format
        type: exec
        options:
          timeout: 300
          cmds:
            - make autoformat || true
            - git add -A
            - git diff --cached --quiet || git commit -m 'format'

      - name: verify
        type: verify
        options:
          cmds:
            - "make -j8 check && make -j8 test"
          max_iterations: 7
        prompt: [dev-env-howto.md, gremlins:verify_fix.md, gremlins:bail_section_fix.md]
      - name: commit
        type: exec
        options:
          cmds:
            - git add -A
            - git diff --cached --quiet || git commit -m "fix checks"

stages:
  - { type: gremlins:plan-gh, prompt: [code-style, terse, gremlins:plan_gh.md] }
  - { type: gremlins:implement, prompt: [code-style, terse, dev-env, no_lint_in_implement.md, gremlins:implement_gh.md] }
  - { type: check-and-fix }

  - parallel:
      - name: local-review-one
        type: agent
        prompt: [code-style, terse, dev-env, local_review_one.md]
        bind:
          artifact.local-review-one: "file://session/local-review-one.md"
      - name: local-review-two
        type: agent
        prompt: [code-style, terse, dev-env, local_review_two.md]
        bind:
          artifact.local-review-two: "file://session/local-review-two.md"

  - name: local-address
    type: agent
    prompt: [code-style, terse, dev-env, local_address.md, no_lint_in_implement.md, gremlins:bail_section.md]
    interpolation:
      review-one: artifact.local-review-one
      review-two: artifact.local-review-two

  - { type: check-and-fix }
  - { type: gremlins:github-open-pr }
  - { type: gremlins:github-request-copilot-review }
  - { type: gremlins:github-wait-copilot, interpolation: {pr: artifact.pr} }
  - { name: github-address-pull-request-reviews, type: agent, interpolation: {pr: artifact.pr}, prompt: [code-style, terse, dev-env, gremlins:github_address_pull_request_reviews.md, gremlins:bail_section.md] }
  - { type: check-and-fix }
  - { type: gremlins:github-wait-ci, interpolation: {pr: artifact.pr}, prompt: [terse, dev-env, gremlins:ci_fix.md, gremlins:bail_section_fix.md] }
