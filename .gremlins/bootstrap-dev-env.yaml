# Shared stage: bootstraps a project venv inside the worktree so agents can
# run make check / make test without sandbox "path outside worktree" errors.
# Include this as { include: bootstrap-dev-env } at the top of a pipeline.
stages:
  - name: bootstrap-dev-env
    type: exec
    skip_if_exists: dev-env-ready
    out:
      dev-env-ready: file://session/.dev-env-ready
    options:
      cmds:
        - uv venv
        - uv pip install -e ".[dev]"
        - echo ok > "{artifact_dir}/.dev-env-ready"