base_ref: main

prompt_dir: prompts

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: filepath
      optional: true
    pr:
      type: string
  launch_cmds:
    - gremlins:bind_artifact("artifact://plan.md", plan)
    - gremlins:bind_artifact("artifact://instructions.txt", instructions)
    - |
      if [ -n "${pr+x}" ]; then
        printf '%s' "${pr}" > "$GREMLINS_ARTIFACT_DIR/pr-num.txt"
      fi
  cli_out:
    pr: "artifact://pr-num.txt"
  cmds:
    - uv venv .venv
    - uv pip install -e ".[dev]"
  env: |
    export GREMLINS_OPENAI_AGENTS_MAX_TURNS='1000'
    unset VIRTUAL_ENV UV_PYTHON UV_PROJECT_ENVIRONMENT UV_SYSTEM_PYTHON PYTHONPATH
    export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-${GREMLINS_PROJECT_ROOT}/.cargo-gremlin-target}"
    if command -v sccache &>/dev/null; then
        export RUSTC_WRAPPER="${RUSTC_WRAPPER:-sccache}"
    fi
    THE_ENV="${GREMLINS_PROJECT_ROOT}/.gremlins/env"
    if [ -f "$THE_ENV" ]; then
        source "$THE_ENV"
    fi
    export VIRTUAL_ENV="${GREMLINS_WORKTREE_PATH}/.venv"
    export UV_PROJECT_ENVIRONMENT="${GREMLINS_WORKTREE_PATH}/.venv"
    export PATH="${GREMLINS_WORKTREE_PATH}/.venv/bin:${PATH}"

land:
  interpolation:
    PR_URL: content("artifact://pr-url")
  options:
    cmds:
      - gh pr merge --squash --delete-branch "$PR_URL"

prompts:
  code-style: gremlins:code_style.md
  terse: terse_style.md
  verify: [dev-env-howto.md, gremlins:verify_fix.md, gremlins:bail_section_fix.md]
  dev-env: dev-env-howto.md

stage-definitions:
  plan-gh: plan-gh
  github-push-to-pr-branch: github-push-to-pr-branch
  github-request-copilot-review: github-request-copilot-review
  github-wait-copilot: github-wait-copilot
  github-wait-ci: github-wait-ci

# Usage:
#   gremlins launch pr-extend --pr <num|url> --plan '#<issue>'
#
# --pr is the PR to extend; its head is checked out in the gremlin's detached
# worktree. --plan supplies the acceptance criteria (the issue the PR is meant
# to fully satisfy). The pipeline adds new commits on top and pushes back to
# the PR's branch (no rebase, no history rewrite — additive only). Same-repo
# PRs only; fork PRs would need push access to the fork.

stages:
  - name: fetch-pr-info
    type: exec
    interpolation:
      pr_input: content("artifact://pr-num.txt")
    bind:
      pr_url:    "artifact://pr-url.txt"
      pr_branch: "artifact://pr-branch.txt"
      pr_number: "artifact://pr-number.txt"
    options:
      cmds:
        - |
          PR_NUM="${pr_input##*/}" &&
          PR_JSON="$(gh pr view "$PR_NUM" --json url,headRefName,number)" &&
          printf "%s" "$(printf '%s' "$PR_JSON" | jq -r '.url')" > "$GREMLINS_ARTIFACT_DIR/pr-url.txt" &&
          printf "%s" "$(printf '%s' "$PR_JSON" | jq -r '.headRefName')" > "$GREMLINS_ARTIFACT_DIR/pr-branch.txt" &&
          printf "%s" "$(printf '%s' "$PR_JSON" | jq -r '.number')" > "$GREMLINS_ARTIFACT_DIR/pr-number.txt"
  - { type: plan-gh, prompt: [code-style, terse, plan_gh.md] }
  - { type: gremlins:implement, prompt: [code-style, terse, dev-env, no_lint_in_implement.md, implement_pr_extension.md] }
  - name: check-and-fix
    type: verify
    options:
      cmds:
        - "make -j8 check && make -j8 test"
      max_iterations: 7
    prompt: verify
  - { name: push, type: github-push-to-pr-branch }
  - { type: github-request-copilot-review,  interpolation: {pr: content("artifact://pr-url")} }
  - name: fetch-pr-diff
    type: exec
    interpolation:
      pr: content("artifact://pr-url")
    bind:
      pr_diff: "artifact://diff.txt"
    options:
      cmds:
        - "gh pr diff --name-only \"{pr}\" > \"$GREMLINS_ARTIFACT_DIR/diff.txt\""
  - parallel:
      - { type: github-wait-copilot,          interpolation: {pr: content("artifact://pr-url")} }
      - { name: github-review-pull-request,          type: agent, interpolation: {pr: content("artifact://pr-url"), plan: content("artifact://plan.md"), diff: content("artifact://diff.txt")}, prompt: [code-style, terse, dev-env, github_review_pull_request.md] }
      - { name: github-review-pull-request-complexity, type: agent, interpolation: {pr: content("artifact://pr-url"), plan: content("artifact://plan.md"), diff: content("artifact://diff.txt")}, prompt: [code-style, terse, dev-env, complexity_review.md] }
  - { name: github-address-pull-request-reviews, type: agent, interpolation: {pr: content("artifact://pr-url")}, prompt: [code-style, terse, dev-env, github_address_pull_request_reviews.md, gremlins:bail_section.md] }
  - { type: github-wait-ci, interpolation: {pr: content("artifact://pr-url")}, prompt: [terse, dev-env, gremlins:ci_fix.md, gremlins:bail_section_fix.md] }