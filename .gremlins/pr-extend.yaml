base_ref: main

prompt_dir: prompts

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: filepath
      optional: true
    pr:
      type: string
  launch_cmds:
    - gremlins:bind_artifact(plan, plan, file://session/plan.md)
    - gremlins:bind_artifact(instructions, instructions, file://session/instructions.txt)
  cmds:
    - uv venv .venv
    - uv pip install -e ".[dev]"
  env: |
    export GREMLINS_OPENAI_AGENTS_MAX_TURNS='1000'
    unset VIRTUAL_ENV UV_PYTHON UV_PROJECT_ENVIRONMENT UV_SYSTEM_PYTHON PYTHONPATH
    export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-${GREMLINS_PROJECT_ROOT}/.cargo-gremlin-target}"
    if command -v sccache &>/dev/null; then
        export RUSTC_WRAPPER="${RUSTC_WRAPPER:-sccache}"
    fi
    SECRET_ENV="${GREMLINS_PROJECT_ROOT}/.gremlins/secret_env"
    if [ -f "$SECRET_ENV" ]; then
        source "$SECRET_ENV"
    fi
    export VIRTUAL_ENV="${GREMLINS_WORKTREE_PATH}/.venv"
    export UV_PROJECT_ENVIRONMENT="${GREMLINS_WORKTREE_PATH}/.venv"
    export PATH="${GREMLINS_WORKTREE_PATH}/.venv/bin:${PATH}"

land:
  interpolation:
    PR_URL: artifact.pr-url
  options:
    cmds:
      - gh pr merge --squash --delete-branch "$PR_URL"

prompts:
  code-style: gremlins:code_style.md
  terse: terse_style.md
  verify: [dev-env-howto.md, gremlins:verify_fix.md, gremlins:bail_section_fix.md]
  dev-env: dev-env-howto.md

stage-definitions:
  check-and-fix:
    type: verify
    options:
      cmds:
        - "make -j8 check && make -j8 test"
      max_iterations: 7
    prompt: verify

# Usage:
#   gremlins launch pr-extend --pr <num|url> --plan '#<issue>'
#
# --pr is the PR to extend; its head is checked out in the gremlin's detached
# worktree. --plan supplies the acceptance criteria (the issue the PR is meant
# to fully satisfy). The pipeline adds new commits on top and pushes back to
# the PR's branch (no rebase, no history rewrite — additive only). Same-repo
# PRs only; fork PRs would need push access to the fork.

stages:
  - name: fetch-pr-info
    type: exec
    interpolation:
      pr_uri: artifact.pr.uri
    bind:
      artifact.pr-url:    "file://session/pr-url.txt"
      artifact.pr-branch: "file://session/pr-branch.txt"
      artifact.pr-number: "file://session/pr-number.txt"
    options:
      cmds:
        - |
          PR_NUM="${pr_uri##*/}" &&  # gh://pr/N — strip trailing segment to get number
          PR_JSON="$(gh pr view "$PR_NUM" --json url,headRefName,number)" &&
          printf "%s" "$(printf '%s' "$PR_JSON" | jq -r '.url')" > "{artifact_dir}/pr-url.txt" &&
          printf "%s" "$(printf '%s' "$PR_JSON" | jq -r '.headRefName')" > "{artifact_dir}/pr-branch.txt" &&
          printf "%s" "$(printf '%s' "$PR_JSON" | jq -r '.number')" > "{artifact_dir}/pr-number.txt"
  - { type: gremlins:plan-gh, prompt: [code-style, terse, gremlins:plan_gh.md] }
  - { type: gremlins:implement, prompt: [code-style, terse, dev-env, no_lint_in_implement.md, implement_pr_extension.md] }
  - { type: check-and-fix }
  - { name: push, type: gremlins:github-push-to-pr-branch }

  - { type: gremlins:github-request-copilot-review,  interpolation: {pr: artifact.pr} }

  - parallel:
      - { type: gremlins:github-wait-copilot,          interpolation: {pr: artifact.pr} }
      - { name: github-review-pull-request,          type: agent, interpolation: {pr: artifact.pr}, prompt: [code-style, terse, dev-env, gremlins:github_review_pull_request.md] }
      - { name: github-review-pull-request-complexity, type: agent, interpolation: {pr: artifact.pr}, prompt: [code-style, terse, dev-env, complexity_review.md] }

  - { name: github-address-pull-request-reviews, type: agent, interpolation: {pr: artifact.pr}, prompt: [code-style, terse, dev-env, gremlins:github_address_pull_request_reviews.md, gremlins:bail_section.md] }
  - { type: gremlins:github-wait-ci, interpolation: {pr: artifact.pr}, prompt: [terse, dev-env, gremlins:ci_fix.md, gremlins:bail_section_fix.md] }
