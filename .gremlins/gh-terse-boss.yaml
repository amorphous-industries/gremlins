base_ref: current

prompt_dir: prompts

prompts:
  code-style: gremlins:code_style.md
  dev-env: dev-env-howto.md

bootstrap:
  cmds:
    - uv venv .venv
    - uv pip install -e ".[dev]"
  env: |
    export GREMLINS_OPENAI_AGENTS_MAX_TURNS='1000'
    unset VIRTUAL_ENV UV_PYTHON UV_PROJECT_ENVIRONMENT UV_SYSTEM_PYTHON PYTHONPATH
    export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-${GREMLINS_PROJECT_ROOT}/.cargo-gremlin-target}"
    if command -v sccache &>/dev/null; then
        export RUSTC_WRAPPER="${RUSTC_WRAPPER:-sccache}"
    fi
    THE_ENV="${GREMLINS_PROJECT_ROOT}/.gremlins/env"
    if [ -f "$THE_ENV" ]; then
        source "$THE_ENV"
    fi
    export VIRTUAL_ENV="${GREMLINS_WORKTREE_PATH}/.venv"
    export UV_PROJECT_ENVIRONMENT="${GREMLINS_WORKTREE_PATH}/.venv"
    export PATH="${GREMLINS_WORKTREE_PATH}/.venv/bin:${PATH}"

stages:
  - name: chain
    type: loop
    stop_when_exists: "artifact://done"
    options:
      max_iterations: 10
    body:
      - name: detach-prior-pr
        type: exec
        options:
          cmds:
            - |
              if [ -f "$GREMLINS_ARTIFACT_DIR/pr-branch.txt" ]; then
                branch="$(cat "$GREMLINS_ARTIFACT_DIR/pr-branch.txt")"
                if [ -n "$branch" ]; then
                  git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" && git checkout --detach "origin/$branch"
                fi
              fi
      - { name: handoff, type: gremlins:handoff }
      - { include: gh-terse }

  - name: review-chain
    type: review-code
    prompt: [code-style, gremlins:review/chain.md, dev-env]

  - name: address-chain
    type: agent
    prompt: [code-style, gremlins:address.md, gremlins:bail_section.md, dev-env]
    interpolation:
      text: content("artifact://review-chain")
