[package]
name = "gremlins"
version = "0.0.0"
edition = "2021"

[lib]
name = "gremlins"
crate-type = ["rlib"]

[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["process", "time", "rt", "sync", "io-util", "macros"] }
shlex = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
glob = "0.3"
rig-core = { version = "0.41", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
rig-core = { version = "0.41", features = ["test-utils"] }
