required-prompt: true

stages:
  - name: implement
    type: agent
    interpolation:
      spec: content("artifact://spec.md")?
      plan: content("artifact://plan.md")
    prompt:
      - "{{prompt}}"
    options:
      idle_timeout: 600
      capture_events: true
  - name: git-commit
    type: exec
    options:
      cmds:
        - git add -A
        - git diff --cached --quiet || git commit -m "implement plan"
  - name: require-impl-progress
    type: exec
    interpolation:
      base_sha: content("artifact://base_sha")
    options:
      cmds:
        - |
          base="${base_sha#git://commit/}"
          git merge-base --is-ancestor "$base" HEAD || {
            echo "implement diverged from $base; expected fast-forward" >&2
            exit 1
          }
        - |
          base="${base_sha#git://commit/}"
          test "$(git rev-list --count "$base"..HEAD)" -gt 0 || {
            echo "implement produced no commits since $base" >&2
            exit 1
          }
