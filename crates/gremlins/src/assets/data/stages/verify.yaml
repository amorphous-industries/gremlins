required-options:
  - cmds
required-prompt: true

stages:
  - name: verify
    type: loop
    stop_when_exists: done
    max-iterations: "{{options.max_iterations | default(3)}}"
    body:
      - name: cmd
        type: exec
        bind:
          artifact.verify_log: "file://session/verify_output.txt"
          artifact.done?: "file://session/done"
        options:
          timeout: "{{options.timeout | default(900)}}"
          cmds:
            - rm -f -- "{artifact_dir}/done"; ({{options.cmds}}) > "{artifact_dir}/verify_output.txt" 2>&1; rc=$?; printf '%d' "$rc" > "{artifact_dir}/exec_exit_code"; if [ "$rc" -eq 0 ]; then printf 'done' > "{artifact_dir}/done"; fi; true
      - name: fix
        type: agent
        skip_if_exists: done
        prompt:
          - "{{prompt}}"
        interpolation:
          verify_output: artifact.verify_log
