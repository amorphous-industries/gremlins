[package]
name = "gremlins-core"
version = "0.0.0"
edition = "2021"

[lib]
name = "gremlins_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.29"
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
libc = "0.2"
tokio = { version = "1", features = ["process", "time", "rt", "sync", "io-util", "macros"] }
shlex = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
glob = "0.3"
rig-core = { version = "0.41", features = ["derive"] }
rig-agent = { version = "0.41" }
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
rig-core = { version = "0.41", features = ["test-utils"] }
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[features]
extension-module = ["pyo3/extension-module"]
