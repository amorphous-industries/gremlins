# Extends an existing PR: plan, implement, verify, push, then review/CI.
# Usage: gremlins launch pr-extend --pr <num|url> --plan '#<issue>'

default_client: 'xai:grok-4'

base_ref: main

github_integration: true

bootstrap:
  source:
    instructions:
      type: string
      optional: true
    plan:
      type: [filepath, string]
      optional: true
    pr:
      type: string
  launch_cmds:
    - gremlins:bind_artifact("artifact://plan.md", plan)
    - gremlins:bind_artifact("artifact://instructions.txt", instructions)
    - |
      if [ -n "${pr+x}" ]; then
        printf '%s' "${pr}" > "$GREMLINS_ARTIFACT_DIR/pr-input.txt"
      fi
  cli_out:
    pr: "artifact://pr-input.txt"

prompts:
  code-style: gremlins:code_style.md
  verify: [gremlins:verify_fix.md, gremlins:bail_section_fix.md]

stages:
  - name: fetch-pr-info
    type: exec
    interpolation:
      pr_input: content("artifact://pr-input.txt")
    bind:
      pr_url:    "artifact://pr-url.txt"
      pr_branch: "artifact://pr-branch.txt"
      pr_number: "artifact://pr-number.txt"
    options:
      cmds:
        - |
          PR_NUM="${pr_input##*/}" &&
          PR_JSON="$(gh pr view "$PR_NUM" --json url,headRefName,number)" &&
          printf "%s" "$(printf '%s' "$PR_JSON" | jq -r '.url')" > "$GREMLINS_ARTIFACT_DIR/pr-url.txt" &&
          printf "%s" "$(printf '%s' "$PR_JSON" | jq -r '.headRefName')" > "$GREMLINS_ARTIFACT_DIR/pr-branch.txt" &&
          printf "%s" "$(printf '%s' "$PR_JSON" | jq -r '.number')" > "$GREMLINS_ARTIFACT_DIR/pr-number.txt"
  - { type: gremlins:plan-gh,                    prompt: [code-style, gremlins:plan_gh.md] }
  - { type: gremlins:implement,                 prompt: [code-style, gremlins:implement_gh.md] }
  - name: normalize
    type: exec
    options:
      cmds:
        - "ruff format . && ruff check --fix . && git add -A && (git diff --cached --quiet || git commit -m 'normalize')"
    bind:
      normalize_commits?: "artifact://normalize-commits"
  - { name: verify-check, type: verify, options: { cmds: ["make check"] }, prompt: verify }
  - { name: verify-test,  type: verify, options: { cmds: ["make test"] },  prompt: verify }
  - { name: push,      type: gremlins:github-push-to-pr-branch }
  - { type: gremlins:github-request-copilot-review }
  - name: fetch-pr-diff
    type: exec
    interpolation:
      pr: content("artifact://pr-url.txt")
    bind:
      pr_diff: "artifact://diff.txt"
    options:
      cmds:
        - "gh pr diff --name-only \"{pr}\" > \"$GREMLINS_ARTIFACT_DIR/diff.txt\""
  - { name: github-review-pull-request,                             type: agent, interpolation: {pr: content("artifact://pr-url.txt"), plan: content("artifact://plan.md"), diff: content("artifact://diff.txt")}, prompt: [code-style, gremlins:github_review_pull_request.md] }
  - { type: gremlins:github-wait-copilot }
  - { name: github-address-pull-request-reviews,                    type: agent, interpolation: {pr: content("artifact://pr-url.txt")}, prompt: [code-style, gremlins:github_address_pull_request_reviews.md, gremlins:bail_section.md] }
  - { name: ci-gate,   type: gremlins:github-wait-ci,               prompt: [gremlins:ci_fix.md, gremlins:bail_section_fix.md] }